<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học sinh vào lớp — HY Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="back-home" href="index.html">← Về trang chủ</a>

<div class="auth-wrap">
  <div class="brand-header">
    <img src="assets/logo.png" alt="HY Chinese logo">
    <div class="brand-name">HY Chinese</div>
  </div>

  <div class="card">
    <div id="class-picker" style="display:none;">
      <h1>📚 Chọn lớp để vào học</h1>
      <p class="sub">Em đang tham gia nhiều lớp — chọn 1 lớp để vào học</p>
      <div id="class-picker-list" style="display:flex;flex-direction:column;gap:10px;margin:18px 0;"></div>
      <button type="button" id="show-join-form-btn" style="width:100%;padding:12px;border:1.5px solid var(--line,#ecdfd0);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;">+ Nhập mã lớp khác</button>
    </div>

    <div id="join-form-wrap">
      <h1>🎒 Vào lớp học</h1>
      <p class="sub" id="join-sub">Nhập mã lớp giáo viên đã cung cấp và tên của em</p>

      <form id="join-form">
        <div class="field">
          <label for="join-code">Mã lớp</label>
          <input type="text" id="join-code" class="join-code" required placeholder="HY-XXXX" maxlength="12">
        </div>
        <div class="field">
          <label for="join-name">Họ và tên</label>
          <input type="text" id="join-name" required placeholder="Nguyễn Văn A">
        </div>
        <button type="submit" class="btn-primary" id="join-btn">Vào lớp →</button>
        <p class="form-msg" id="join-msg"></p>
      </form>
      <button type="button" id="back-to-picker-btn" style="display:none;width:100%;margin-top:10px;padding:12px;border:none;background:none;color:var(--ink-soft,#6b6560);cursor:pointer;font-size:13.5px;">← Quay lại danh sách lớp</button>
    </div>

    <div id="dup-confirm" style="display:none;margin-top:18px;padding:16px;background:var(--paper-soft,#f7ede1);border-radius:12px;">
      <p style="font-size:14px;margin:0 0 12px;">Lớp đã có bạn tên "<b id="dup-name"></b>" rồi — <b>đây có phải là bạn không?</b></p>
      <button type="button" class="btn-primary" id="dup-yes-btn" style="width:100%;justify-content:center;margin-bottom:8px;">✅ Đúng, là tôi — tiếp tục học</button>
      <button type="button" id="dup-no-btn" style="width:100%;padding:12px;border:1.5px solid var(--line,#ecdfd0);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;">🙋 Không, tôi là học sinh mới</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
// Chống lỗi Chrome/Safari phục hồi trang cũ từ bộ nhớ đệm back-forward (bfcache)
// khi bấm Back/Forward hoặc điều hướng lại — nếu không ép tải lại, trang sẽ giữ
// nguyên trạng thái đăng nhập CŨ (vd: còn hiện học sinh khác dù vừa đăng nhập giáo viên).
window.addEventListener('pageshow', (event) => {
  if (event.persisted) window.location.reload();
});
</script>
<script>
// forceSwitch=true khi vào bằng link "đổi lớp / thêm lớp" (student-join.html?switch=1) từ trang học —
// khi đó LUÔN hiện màn chọn lớp (nếu có ≥1 lớp) thay vì tự động vào thẳng lớp cũ.
const forceSwitch = new URLSearchParams(window.location.search).has('switch');

function renderClassPicker(list) {
  document.getElementById('class-picker').style.display = 'block';
  document.getElementById('join-form-wrap').style.display = 'none';
  document.getElementById('back-to-picker-btn').style.display = 'block';
  document.getElementById('join-sub').textContent = 'Thêm một lớp mới bằng mã giáo viên đã cung cấp';
  const box = document.getElementById('class-picker-list');
  box.innerHTML = list.map(s => `
    <button type="button" class="btn-primary pick-class-btn" data-id="${s.id}" style="width:100%;justify-content:space-between;text-align:left;">
      <span>${s.classes?.name || 'Lớp'}</span>
      <span style="opacity:.85;font-weight:600;">${s.classes?.hsk_level || ''} →</span>
    </button>
  `).join('');
  box.querySelectorAll('.pick-class-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const student = list.find(s => s.id === btn.dataset.id);
      selectStudentClass(student);
      window.location.href = 'student-home.html';
    });
  });
}

(async () => {
  const list = await getStudentClasses();
  if (!forceSwitch && list.length === 1) {
    // học sinh 1 lớp duy nhất -> giữ nguyên trải nghiệm cũ, vào thẳng
    selectStudentClass(list[0]);
    window.location.href = 'student-home.html';
    return;
  }
  if (list.length >= 1) {
    renderClassPicker(list);
  }
  // list.length === 0 -> chưa từng vào lớp nào, giữ nguyên form nhập mã mặc định
})();

document.getElementById('show-join-form-btn')?.addEventListener('click', () => {
  document.getElementById('class-picker').style.display = 'none';
  document.getElementById('join-form-wrap').style.display = 'block';
});
document.getElementById('back-to-picker-btn')?.addEventListener('click', async () => {
  const list = await getStudentClasses();
  document.getElementById('join-form-wrap').style.display = 'none';
  renderClassPicker(list);
});

let pendingJoinCode = '', pendingName = '', pendingExistingId = '';

document.getElementById('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('join-btn');
  const msg = document.getElementById('join-msg');
  msg.className = 'form-msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Đang vào lớp...';

  pendingJoinCode = document.getElementById('join-code').value;
  pendingName = document.getElementById('join-name').value;

  try {
    await studentJoinClass(pendingJoinCode, pendingName);
    window.location.href = 'student-home.html';
  } catch (err) {
    if (err.code === 'DUPLICATE_NAME') {
      pendingExistingId = err.existingStudent.id;
      document.getElementById('dup-name').textContent = err.existingStudent.full_name;
      document.getElementById('join-form').style.display = 'none';
      document.getElementById('dup-confirm').style.display = 'block';
      btn.disabled = false; btn.textContent = 'Vào lớp →';
      return;
    }
    msg.className = 'form-msg error';
    msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Vào lớp →';
  }
});

document.getElementById('dup-yes-btn').addEventListener('click', async () => {
  const b = document.getElementById('dup-yes-btn');
  b.disabled = true; b.textContent = 'Đang vào lớp...';
  try {
    await studentJoinClass(pendingJoinCode, pendingName, { relinkStudentId: pendingExistingId });
    window.location.href = 'student-home.html';
  } catch (err) {
    alert('Có lỗi: ' + err.message);
    b.disabled = false; b.textContent = '✅ Đúng, là tôi — tiếp tục học';
  }
});

document.getElementById('dup-no-btn').addEventListener('click', async () => {
  const b = document.getElementById('dup-no-btn');
  b.disabled = true; b.textContent = 'Đang tạo hồ sơ mới...';
  try {
    await studentJoinClass(pendingJoinCode, pendingName, { forceNew: true });
    window.location.href = 'student-home.html';
  } catch (err) {
    alert('Có lỗi: ' + err.message);
    b.disabled = false; b.textContent = '🙋 Không, tôi là học sinh mới';
  }
});

// tự viết hoa mã lớp khi gõ
document.getElementById('join-code').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase();
});
</script>
</body>
</html>
