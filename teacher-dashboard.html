<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng điều khiển giáo viên — HY Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
.new-class-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;}
.new-class-row input{flex:1 1 200px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;background:var(--paper-soft);}
.new-class-row select{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;background:var(--paper-soft);}
.new-class-row button{padding:12px 20px;border:none;border-radius:12px;background:linear-gradient(145deg,var(--seal),var(--seal-dark));color:#fff;font-weight:700;font-size:14.5px;}
.class-card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:22px 24px;margin-bottom:18px;}
.class-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.class-card h3{font-family:var(--font-display);font-size:19px;margin:0;}
.join-code-pill{background:var(--gold-soft);color:var(--seal-dark);font-weight:700;font-size:13.5px;letter-spacing:.08em;padding:6px 14px;border-radius:999px;}
.class-meta{color:var(--ink-soft);font-size:13.5px;margin-bottom:14px;}
.student-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap;}
.student-row .name{font-weight:600;flex:0 0 140px;padding-top:4px;}
.student-row .stat{color:var(--ink-soft);font-size:13px;}
.progress-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.progress-chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
.progress-chip.done{background:#e8f3ec;border-color:#bfe0cc;color:var(--green);}
.progress-chip.partial{background:var(--gold-soft);border-color:#e6d4a0;color:var(--seal-dark);}
.progress-chip.none{background:var(--paper-soft);color:var(--ink-soft);}
.student-toggle{font-size:12.5px;color:var(--seal);font-weight:600;cursor:pointer;background:none;border:none;padding:0;}
.student-detail{width:100%;margin-top:8px;padding:12px 14px;background:var(--paper-soft);border-radius:10px;font-size:13px;display:none;}
.student-detail.show{display:block;}
.student-detail table{width:100%;border-collapse:collapse;}
.student-detail td{padding:4px 6px;border-bottom:1px solid var(--line);}
.msg-inline{font-size:13.5px;margin-top:8px;}
</style>
</head>
<body>

<div class="topbar">
  <img src="assets/logo.png" alt="logo">
  <span class="who" id="teacher-name">Giáo viên</span>
  <a class="signout" href="student-home.html" style="margin-left:auto;margin-right:16px;">👁️ Xem nội dung bài học</a>
  <a class="signout" href="#" id="signout-link">Đăng xuất</a>
</div>

<div class="dash-wrap">
  <h1>Lớp học của tôi</h1>
  <p class="sub">Tạo lớp mới, chia sẻ mã lớp cho học sinh và theo dõi tiến độ.</p>

  <form class="new-class-row" id="new-class-form">
    <input type="text" id="new-class-name" placeholder="Tên lớp (vd: HSK1 - Tối T3-T5)" required>
    <select id="new-class-level">
      <option value="HSK1">HSK1</option>
      <option value="HSK2">HSK2</option>
      <option value="HSK3">HSK3</option>
    </select>
    <button type="submit">+ Tạo lớp mới</button>
  </form>
  <p class="msg-inline" id="new-class-msg"></p>

  <div id="classes-list"><p class="sub">Đang tải danh sách lớp...</p></div>
</div>

<div id="hw-detail-modal" style="display:none;position:fixed;inset:0;background:rgba(44,44,44,.55);z-index:200;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:26px;position:relative;">
    <button id="hw-detail-close" style="position:absolute;top:16px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--ink-soft);">✕</button>
    <div id="hw-detail-body"><p class="sub">Đang tải...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
// Hàm xem chi tiết bài nộp — TỔNG QUÁT, dùng chung cho MỌI bài/mọi kiểu bài tập sau này.
// Không cần biết cấu trúc câu hỏi: chỉ đọc thẳng dữ liệu tự mô tả (title/label/given/correct_answer)
// mà học sinh đã lưu sẵn trong submissions.answer lúc nộp bài — không cần sửa file này khi thêm bài mới.
async function showHomeworkDetail(studentId, studentName, lessonId, lessonTitle) {
  const modal = document.getElementById('hw-detail-modal');
  const body = document.getElementById('hw-detail-body');
  modal.style.display = 'flex';
  body.innerHTML = '<p class="sub">Đang tải...</p>';

  // 1) tìm mọi bài tập (exercise) thuộc bài học này
  const { data: exercises, error: exErr } = await sb
    .from('exercises')
    .select('id, order_index')
    .eq('lesson_id', lessonId)
    .order('order_index', { ascending: true });
  if (exErr) { body.innerHTML = `<p class="sub">Lỗi tải bài tập: ${exErr.message}</p>`; return; }
  if (!exercises || !exercises.length) { body.innerHTML = '<p class="sub">Bài này chưa có bài tập nộp.</p>'; return; }

  // 2) lấy bài nộp của đúng học sinh này cho các bài tập đó
  const { data: subs, error: subErr } = await sb
    .from('submissions')
    .select('exercise_id, answer, submitted_at')
    .eq('student_id', studentId)
    .in('exercise_id', exercises.map(e => e.id))
    .order('submitted_at', { ascending: true });
  if (subErr) { body.innerHTML = `<p class="sub">Lỗi tải bài nộp: ${subErr.message}</p>`; return; }
  if (!subs || !subs.length) { body.innerHTML = '<p class="sub">Học sinh chưa nộp phần nào của bài này.</p>'; return; }

  // 3) render tổng quát — mỗi submission tự mô tả đầy đủ (title/details[].label/given/correct_answer/correct)
  const sectionsHtml = subs.map(sub => {
    const a = sub.answer || {};
    const title = a.title || 'Bài tập nộp';
    const rows = (a.details || []).map(d => `
      <div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:12.5px;">
        <span style="flex:1;">${d.label ?? ''}</span>
        <span>Học sinh: <b>${d.given ?? ''}</b></span>
        <span>${d.correct ? '✅' : `❌ (đúng: <b>${d.correct_answer ?? ''}</b>)`}</span>
      </div>`).join('');
    return `<div style="margin-bottom:16px;">
      <h4 style="font-size:14px;margin:0 0 4px;">${title}${(a.correct != null && a.total != null) ? ` — ${a.correct}/${a.total} đúng` : ''}</h4>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Nộp lúc: ${sub.submitted_at ? new Date(sub.submitted_at).toLocaleString('vi-VN') : '—'}</div>
      ${rows || '<p class="sub" style="font-size:12.5px;">(không có chi tiết từng câu)</p>'}
    </div>`;
  }).join('');

  body.innerHTML = `
    <h3 style="margin:0 0 4px;">${studentName} — ${shortLessonTitle(lessonTitle)}</h3>
    <p class="sub" style="margin:0 0 18px;">Chi tiết bài tập nộp (tự động chấm)</p>
    ${sectionsHtml}
  `;
}

document.getElementById('hw-detail-close').addEventListener('click', () => {
  document.getElementById('hw-detail-modal').style.display = 'none';
});
document.getElementById('hw-detail-modal').addEventListener('click', (e) => {
  if (e.target.id === 'hw-detail-modal') e.target.style.display = 'none';
});

let TEACHER = null;

function genJoinCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // bỏ ký tự dễ nhầm (O/0, I/1)
  let code = 'HY-';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

async function init() {
  TEACHER = await getCurrentTeacherProfile();
  if (!TEACHER) { window.location.href = 'teacher-login.html'; return; }
  document.getElementById('teacher-name').textContent = TEACHER.full_name || TEACHER.email;
  await loadClasses();
}

async function loadClasses() {
  const listEl = document.getElementById('classes-list');
  const { data: classes, error } = await sb
    .from('classes')
    .select('*')
    .eq('teacher_id', TEACHER.id)
    .order('created_at', { ascending: false });

  if (error) { listEl.innerHTML = `<p class="sub">Lỗi tải lớp: ${error.message}</p>`; return; }
  if (!classes.length) {
    listEl.innerHTML = `<div class="empty-state">Chưa có lớp nào. Tạo lớp đầu tiên ở trên để lấy mã cho học sinh.</div>`;
    return;
  }

  // Lấy toàn bộ tiến độ (mọi lớp, mọi học sinh, mọi bài) của giáo viên này 1 lần duy nhất
  const { data: progressRows, error: progErr } = await sb
    .from('teacher_student_progress')
    .select('*')
    .eq('teacher_id', TEACHER.id);
  if (progErr) console.warn('Không tải được tiến độ bài tập nộp:', progErr.message);

  // Tiến độ 7 phần ôn tập (Từ vựng, Hán tự, Ôn từ vựng, Ghép câu, Ngữ pháp, Bài khoá, Phát âm)
  const { data: activityRows, error: actErr } = await sb
    .from('teacher_activity_progress')
    .select('*')
    .eq('teacher_id', TEACHER.id);
  if (actErr) console.warn('Không tải được tiến độ ôn tập:', actErr.message);

  const activityByStudent = {};
  (activityRows || []).forEach(r => {
    if (!activityByStudent[r.student_id]) activityByStudent[r.student_id] = [];
    activityByStudent[r.student_id].push(r);
  });

  const progressByStudent = {};
  (progressRows || []).forEach(r => {
    if (!progressByStudent[r.student_id]) progressByStudent[r.student_id] = [];
    progressByStudent[r.student_id].push(r);
  });

  listEl.innerHTML = '';
  for (const cls of classes) {
    const { data: students } = await sb
      .from('students')
      .select('id, full_name')
      .eq('class_id', cls.id)
      .order('full_name');

    const card = document.createElement('div');
    card.className = 'class-card';
    card.innerHTML = `
      <div class="class-card-head">
        <h3>${cls.name}</h3>
        <span class="join-code-pill">${cls.join_code}</span>
      </div>
      <div class="class-meta">${cls.hsk_level} · ${students?.length || 0} học sinh</div>
      <div id="students-${cls.id}">
        ${(students || []).map(s => renderStudentRow(s, progressByStudent[s.id] || [], activityByStudent[s.id] || [])).join('') || '<p class="sub">Chưa có học sinh nào tham gia.</p>'}
      </div>
    `;
    listEl.appendChild(card);
  }

  // gắn sự kiện bấm "Xem chi tiết"
  listEl.querySelectorAll('.student-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const detail = btn.closest('.student-row').querySelector('.student-detail');
      detail.classList.toggle('show');
      btn.textContent = detail.classList.contains('show') ? 'Ẩn chi tiết ▲' : 'Xem chi tiết ▼';
    });
  });

  // gắn sự kiện bấm "Xem đáp án" (chi tiết từng câu đúng/sai của bài tập nộp)
  listEl.querySelectorAll('.hw-view-detail').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      showHomeworkDetail(
        a.dataset.student, a.dataset.studentName,
        a.dataset.lesson, a.dataset.lessonTitle
      );
    });
  });
}

const HY_SECTIONS = [
  {key:'Từ vựng', icon:'🔤'},
  {key:'Hán tự', icon:'✍️'},
  {key:'Ôn từ vựng', icon:'🔄'},
  {key:'Ghép câu', icon:'🧩'},
  {key:'Ngữ pháp', icon:'📘'},
  {key:'Bài khoá', icon:'📖'},
  {key:'Phát âm', icon:'🎙️'},
];

function shortLessonTitle(title) {
  // "Bài 4 — 我有两个孩子" -> "Bài 4"  (giáo viên chỉ cần thấy số bài, không cần tên dài)
  const m = (title || '').match(/^(Bài \d+)/);
  return m ? m[1] : title;
}

function renderStudentRow(student, progressRows, activityRows) {
  // gộp bài học xuất hiện ở cả bài tập nộp lẫn 7 phần ôn tập vào 1 danh sách chung
  const lessonMap = {};
  progressRows.forEach(r => {
    lessonMap[r.lesson_id] = lessonMap[r.lesson_id] || { title: r.lesson_title, activities: {} };
    lessonMap[r.lesson_id].homework = r;
  });
  activityRows.forEach(r => {
    lessonMap[r.lesson_id] = lessonMap[r.lesson_id] || { title: r.lesson_title, activities: {} };
    lessonMap[r.lesson_id].activities[r.section] = r;
  });

  const lessonIds = Object.keys(lessonMap).sort((a, b) => {
    const numA = parseInt((lessonMap[a].title || '').match(/Bài (\d+)/)?.[1] || '999', 10);
    const numB = parseInt((lessonMap[b].title || '').match(/Bài (\d+)/)?.[1] || '999', 10);
    return numA - numB;
  });
  if (!lessonIds.length) {
    return `
      <div class="student-row">
        <span class="name">${student.full_name}</span>
        <span class="stat">Chưa bắt đầu bài nào</span>
      </div>`;
  }

  const chips = lessonIds.map(lid => {
    const L = lessonMap[lid];
    const doneSections = HY_SECTIONS.filter(s => L.activities[s.key]).length;
    const hwDone = L.homework && L.homework.total_exercises > 0 && L.homework.completed_exercises >= L.homework.total_exercises;
    const totalDone = doneSections + (hwDone ? 1 : 0);
    const cls = totalDone >= 8 ? 'done' : (totalDone > 0 ? 'partial' : 'none');
    const icon = totalDone >= 8 ? '✅' : (totalDone > 0 ? '🕐' : '⬜');
    return `<span class="progress-chip ${cls}">${icon} ${shortLessonTitle(L.title)}: ${totalDone}/8 phần</span>`;
  }).join('');

  const headerCells = HY_SECTIONS.map(s => `<td style="text-align:center;font-size:15px;" title="${s.key}">${s.icon}</td>`).join('');

  const detailRows = lessonIds.map(lid => {
    const L = lessonMap[lid];
    const sectionCells = HY_SECTIONS.map(s => {
      const a = L.activities[s.key];
      if (!a) return `<td style="text-align:center;color:var(--ink-soft);">⬜</td>`;
      const sub = s.key === 'Phát âm' ? `${a.activity_count} từ` : (a.last_extra || '');
      return `<td style="text-align:center;">✅${sub ? `<br><span style="font-size:10.5px;color:var(--ink-soft);">${sub}</span>` : ''}</td>`;
    }).join('');
    const hw = L.homework;
    const hwCell = hw
      ? `${hw.completed_exercises}/${hw.total_exercises}<br><span style="font-size:10.5px;color:var(--ink-soft);">${hw.correct_mcq ?? 0} đúng</span>
         ${hw.completed_exercises > 0 ? `<br><a href="#" class="hw-view-detail" data-student="${student.id}" data-student-name="${student.full_name}" data-lesson="${lid}" data-lesson-title="${L.title}" style="font-size:10.5px;">🔍 Xem đáp án</a>` : ''}`
      : '0/0';
    return `
      <tr>
        <td style="padding:6px 8px;"><b>${shortLessonTitle(L.title)}</b></td>
        ${sectionCells}
        <td style="text-align:center;">${hwCell}</td>
      </tr>
      <tr id="hw-detail-row-${student.id}-${lid}" style="display:none;">
        <td colspan="${HY_SECTIONS.length + 2}" style="background:var(--paper-soft);padding:10px;"></td>
      </tr>`;
  }).join('');

  return `
    <div class="student-row">
      <span class="name">${student.full_name}</span>
      <div class="progress-chips">${chips}</div>
      <button class="student-toggle">Xem chi tiết ▼</button>
      <div class="student-detail">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <tr><td><b>Bài</b></td>${headerCells}<td style="text-align:center;font-size:15px;" title="Bài tập nộp">📝</td></tr>
          ${detailRows}
        </table>
      </div>
    </div>`;
}

document.getElementById('new-class-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('new-class-msg');
  msg.textContent = '';
  const name = document.getElementById('new-class-name').value.trim();
  const level = document.getElementById('new-class-level').value;
  const join_code = genJoinCode();

  const { error } = await sb.from('classes').insert({
    teacher_id: TEACHER.id, name, hsk_level: level, join_code
  });

  if (error) { msg.style.color = 'var(--red-err)'; msg.textContent = error.message; return; }
  document.getElementById('new-class-name').value = '';
  msg.style.color = 'var(--green)'; msg.textContent = `Đã tạo lớp — mã lớp: ${join_code}`;
  loadClasses();
});

document.getElementById('signout-link').addEventListener('click', async (e) => {
  e.preventDefault();
  await signOutAny();
  window.location.href = 'index.html';
});

init();
</script>
</body>
</html>
