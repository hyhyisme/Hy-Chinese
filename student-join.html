<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học sinh vào lớp — HY Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
.course-card{position:relative;cursor:pointer;}
.course-card .joined-badge{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;background:#e8f3ec;color:var(--green,#2f7d4f);border:1px solid #bfe0cc;border-radius:999px;padding:3px 10px;}
</style>
</head>
<body>

<a class="back-home" href="index.html">← Về trang chủ</a>

<div class="auth-wrap">
  <div class="brand-header">
    <img src="assets/logo.png" alt="HY Chinese logo">
    <div class="brand-name">HY Chinese</div>
  </div>

  <div class="card" style="max-width:680px;">
    <!-- ============ VIEW 1: CHỌN KHOÁ HỌC (màn mặc định) ============ -->
    <div id="course-grid-view">
      <h1>📚 Chọn khoá học</h1>
      <p class="sub">Chọn khoá em muốn vào học. Khoá nào chưa tham gia thì nhập mã lớp giáo viên đã cung cấp.</p>
      <div id="course-grid" class="role-grid" style="max-width:none;"></div>
    </div>

    <!-- ============ VIEW 2: NHẬP MÃ LỚP CHO 1 KHOÁ CỤ THỂ ============ -->
    <div id="join-form-view" style="display:none;">
      <h1>🎒 Vào lớp <span id="join-level-label"></span></h1>
      <p class="sub">Nhập mã lớp giáo viên đã cung cấp và tên của em</p>

      <form id="join-form">
        <div class="field">
          <label for="join-code">Mã lớp</label>
          <input type="text" id="join-code" class="join-code" required placeholder="HY-XXXX" maxlength="12">
        </div>
        <div class="field">
          <label for="join-name">Họ và tên</label>
          <input type="text" id="join-name" required placeholder="Nguyễn Văn A">
        </div>
        <button type="submit" class="btn-primary" id="join-btn">Vào lớp →</button>
        <p class="form-msg" id="join-msg"></p>
      </form>

      <div id="dup-confirm" style="display:none;margin-top:18px;padding:16px;background:var(--paper-soft,#f7ede1);border-radius:12px;">
        <p style="font-size:14px;margin:0 0 12px;">Lớp đã có bạn tên "<b id="dup-name"></b>" rồi — <b>đây có phải là bạn không?</b></p>
        <button type="button" class="btn-primary" id="dup-yes-btn" style="width:100%;justify-content:center;margin-bottom:8px;">✅ Đúng, là tôi — tiếp tục học</button>
        <button type="button" id="dup-no-btn" style="width:100%;padding:12px;border:1.5px solid var(--line,#ecdfd0);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;">🙋 Không, tôi là học sinh mới</button>
      </div>

      <button type="button" id="back-to-grid-btn" style="width:100%;margin-top:14px;padding:12px;border:none;background:none;color:var(--ink-soft,#6b6560);cursor:pointer;font-size:13.5px;">← Quay lại chọn khoá học</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
// Chống lỗi Chrome/Safari phục hồi trang cũ từ bộ nhớ đệm back-forward (bfcache)
// khi bấm Back/Forward hoặc điều hướng lại — nếu không ép tải lại, trang sẽ giữ
// nguyên trạng thái đăng nhập CŨ (vd: còn hiện học sinh khác dù vừa đăng nhập giáo viên).
window.addEventListener('pageshow', (event) => {
  if (event.persisted) window.location.reload();
});
</script>
<script>
// Danh sách khoá học hiển thị trên màn "chọn khoá học". Thêm HSK5/HSK6 vào đây sau này
// khi giáo viên bắt đầu mở các khoá đó — không cần sửa gì thêm ở chỗ khác.
const COURSE_LEVELS = [
  { key: 'HSK1', label: 'HSK 1', emoji: '🌱' },
  { key: 'HSK2', label: 'HSK 2', emoji: '🌿' },
  { key: 'HSK3', label: 'HSK 3', emoji: '🌳' },
  { key: 'HSK4', label: 'HSK 4', emoji: '🏔️' },
];

let joinedList = [];  // tất cả hồ sơ students (mỗi khoá đã tham gia 1 hồ sơ) của thiết bị này
let activeLevel = null; // khoá đang chọn để nhập mã (vd "HSK2")

function normLevel(v) {
  return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function findJoinedForLevel(levelKey) {
  return joinedList.find(s => normLevel(s.classes?.hsk_level) === normLevel(levelKey));
}

function renderCourseGrid() {
  const grid = document.getElementById('course-grid');
  grid.innerHTML = COURSE_LEVELS.map(lv => {
    const joined = findJoinedForLevel(lv.key);
    return `
      <a href="#" class="role-card course-card" data-level="${lv.key}">
        ${joined ? '<span class="joined-badge">✓ Đã tham gia</span>' : ''}
        <span class="emoji">${lv.emoji}</span>
        <h2>${lv.label}</h2>
        <p>${joined ? 'Bấm để vào học' : 'Nhập mã lớp để bắt đầu'}</p>
      </a>
    `;
  }).join('');
  grid.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.preventDefault();
      const level = card.dataset.level;
      const joined = findJoinedForLevel(level);
      if (joined) {
        selectStudentClass(joined);
        window.location.href = 'student-home.html';
      } else {
        showJoinForm(level);
      }
    });
  });
}

function showJoinForm(level) {
  activeLevel = level;
  document.getElementById('course-grid-view').style.display = 'none';
  document.getElementById('join-form-view').style.display = 'block';
  document.getElementById('join-level-label').textContent = level;
  document.getElementById('join-form').style.display = '';
  document.getElementById('dup-confirm').style.display = 'none';
  document.getElementById('join-msg').textContent = '';
  document.getElementById('join-code').value = '';
  document.getElementById('join-name').value = '';
}

document.getElementById('back-to-grid-btn').addEventListener('click', () => {
  document.getElementById('join-form-view').style.display = 'none';
  document.getElementById('course-grid-view').style.display = 'block';
});

(async () => {
  joinedList = await getStudentClasses();
  renderCourseGrid();
})();

let pendingJoinCode = '', pendingName = '', pendingExistingId = '';

document.getElementById('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('join-btn');
  const msg = document.getElementById('join-msg');
  msg.className = 'form-msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Đang vào lớp...';

  pendingJoinCode = document.getElementById('join-code').value;
  pendingName = document.getElementById('join-name').value;

  try {
    await studentJoinClass(pendingJoinCode, pendingName, { expectedLevel: activeLevel });
    window.location.href = 'student-home.html';
  } catch (err) {
    if (err.code === 'DUPLICATE_NAME') {
      pendingExistingId = err.existingStudent.id;
      document.getElementById('dup-name').textContent = err.existingStudent.full_name;
      document.getElementById('join-form').style.display = 'none';
      document.getElementById('dup-confirm').style.display = 'block';
      btn.disabled = false; btn.textContent = 'Vào lớp →';
      return;
    }
    msg.className = 'form-msg error';
    msg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Vào lớp →';
  }
});

document.getElementById('dup-yes-btn').addEventListener('click', async () => {
  const b = document.getElementById('dup-yes-btn');
  b.disabled = true; b.textContent = 'Đang vào lớp...';
  try {
    await studentJoinClass(pendingJoinCode, pendingName, { relinkStudentId: pendingExistingId, expectedLevel: activeLevel });
    window.location.href = 'student-home.html';
  } catch (err) {
    alert('Có lỗi: ' + err.message);
    b.disabled = false; b.textContent = '✅ Đúng, là tôi — tiếp tục học';
  }
});

document.getElementById('dup-no-btn').addEventListener('click', async () => {
  const b = document.getElementById('dup-no-btn');
  b.disabled = true; b.textContent = 'Đang tạo hồ sơ mới...';
  try {
    await studentJoinClass(pendingJoinCode, pendingName, { forceNew: true, expectedLevel: activeLevel });
    window.location.href = 'student-home.html';
  } catch (err) {
    alert('Có lỗi: ' + err.message);
    b.disabled = false; b.textContent = '🙋 Không, tôi là học sinh mới';
  }
});

// tự viết hoa mã lớp khi gõ
document.getElementById('join-code').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase();
});
</script>
</body>
</html>
